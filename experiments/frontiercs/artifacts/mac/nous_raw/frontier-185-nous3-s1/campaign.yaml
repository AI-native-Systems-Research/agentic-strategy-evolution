    \ imply the same constraint.\n\n## Output Format\n\nOutput exactly N lines.\n\n\
    The i-th line must contain one integer x_i \u2208 {0, 1}:\n- 1 indicates that\
    \ vertex i is included in the clique (i \u2208 S).\n- 0 indicates that vertex\
    \ i is excluded from the clique (i \u2209 S).\n\nRequirements:\n- For **every**\
    \ pair of vertices u, v where x_u = 1 and x_v = 1 (and u \u2260 v), it must be\
    \ true that {u, v} \u2208 E.\n\n## Scoring\n\nLet:\n  K = \u03A3 x_i (Total number\
    \ of vertices selected, i.e., sum of 1s in output)\n  K* = Optimal maximum clique\
