metadata:
  iteration: 2
  family: "iterated-ls-penalty-tsp"
  research_question: "What algorithm maximizes the Frontier-CS judge score for algorithmic problem #44?"
  complexity_tier: 2
  tier_justification: "iter 2, single mechanism (SA) + ablation of double-bridge perturbation component"

# Arm selection: h-main tests the full improved SA (double-bridge + multi-city Or-opt + larger KNN).
# h-ablation removes double-bridge to isolate whether perturbation/restart is the key factor
# vs. the improved move operators alone. This is tier 2: single mechanism + ablation.

arms:
  - type: h-main
    prediction: "An iterated local search with double-bridge perturbation, multi-city Or-opt (1-3), larger KNN (20), and penalty-aware neighbor selection will score higher than iter-1's 78.9, because double-bridge escapes local optima that 2-opt/Or-opt cannot, and wider Or-opt segments + larger KNN increase move quality."
    mechanism: "Three synergistic improvements: (1) Or-opt for segments of 1-3 cities finds short-range improvements that single-city relocate misses, especially in clustered regions where moving a pair/triple together preserves local structure. (2) Double-bridge perturbation (non-sequential 4-opt) creates non-reversible changes that 2-opt cannot undo, allowing SA to explore different basins of attraction. After perturbation, SA quickly re-optimizes the perturbed tour. (3) KNN=20 (vs 12) widens the search neighborhood for NN-guided 2-opt, finding better candidate moves. Combined, these let SA explore more solution space within the same 2s budget."
    diagnostic: "If score does not improve: (a) Check if double-bridge perturbations are destroying too much structure (compare tour cost before/after perturbation). (b) Check if multi-city Or-opt delta computation is correct (compare incremental vs full recompute). (c) Check if larger KNN slows construction enough to reduce SA time budget."
    code_changes:
      - file: "solution.cpp"
        intent: "Replace the entire file with an enhanced SA-based TSP solver building on iter-1's approach. Key changes from iter-1: (1) Or-opt moves extended to handle segments of 1, 2, and 3 cities instead of just 1. (2) Add double-bridge perturbation: after SA converges or time thresholds, randomly split the tour into 4 segments and reconnect in a non-sequential way (A-D-C-B pattern), then resume SA. (3) Increase KNN from 12 to 20 for wider NN-guided search. (4) Keep all iter-1 features: grid-based NN construction, NN-guided 2-opt with fast delta, prime scheduling post-pass. (5) Time management: allocate ~0.1s for construction, run SA+double-bridge cycles until 1.75s, then prime scheduling in remaining time."
        rationale: "Double-bridge is the standard technique for escaping 2-opt local optima in TSP, used by LKH. Multi-city Or-opt and larger KNN are incremental but proven improvements in TSP metaheuristics."

  - type: h-ablation
    prediction: "The same solution without double-bridge perturbation will score lower than h-main but higher than iter-1's 78.9, because Or-opt segments and larger KNN still improve move quality even without perturbation."
    mechanism: "Without double-bridge, SA can still benefit from wider Or-opt (1-3 city segments) and larger KNN (20), but remains trapped in the same basin of attraction as iter-1. The improvement over iter-1 comes from better moves; the gap vs h-main reveals the value of perturbation."
    diagnostic: "If ablation scores equal to or higher than h-main: double-bridge may be wasting time on perturbation instead of SA iterations, or the tour quality at convergence is already near the perturbation-accessible optimum."
    code_changes:
      - file: "solution.cpp"
        intent: "Same as h-main but remove the double-bridge perturbation loop. Run continuous SA with the improved moves (Or-opt 1-3, KNN=20, NN-guided 2-opt) for the full time budget without any perturbation/restart cycles."
        rationale: "Isolates whether the score improvement comes from better move operators or from the perturbation/restart mechanism."

experiment_spec:
  preflight_commands: []
  verified_parameters:
    time_limit_seconds: 2
    memory_limit_mb: 512
    max_n: 200000
    baseline_iter1_score: 78.881
  unlocked_parameters_audit:
    - name: "knn_size"
      default_value: 20
      justification: "Increased from iter-1's 12 to widen search; 20 is standard in LKH-style solvers for TSP up to 200K."
    - name: "max_segment_length_2opt"
      default_value: 5000
      justification: "Carried from iter-1; fast delta makes large segments feasible."
    - name: "or_opt_max_segment"
      default_value: 3
      justification: "Standard Or-opt uses 1-3; beyond 3 the delta computation becomes expensive and improvements diminish."
    - name: "sa_initial_temperature"
      default_value: "tourCost/(N*2)"
      justification: "Carried from iter-1; worked well for acceptance rate."
    - name: "double_bridge_interval"
      default_value: "adaptive (on SA convergence)"
      justification: "Perturbation triggered when SA stalls rather than on fixed schedule, to avoid wasting good SA phases."
