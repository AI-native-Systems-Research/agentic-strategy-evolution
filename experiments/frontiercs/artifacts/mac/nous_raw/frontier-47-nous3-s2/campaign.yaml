    \ try a distinct algorithmic strategy (different heuristic, exact method, or optimization)\
    \ and report its measured score. The judge call takes ~30-60s; call it once per\
    \ arm.\n\nOUTPUT FORMAT: Match the statement's Output section EXACTLY: the number\
    \ of lines, the separators (spaces vs newlines), and the token order. A correct\
    \ algorithm can score near zero purely from a format mismatch (for example printing\
    \ one value per line when a single space-separated line is required, or emitting\
