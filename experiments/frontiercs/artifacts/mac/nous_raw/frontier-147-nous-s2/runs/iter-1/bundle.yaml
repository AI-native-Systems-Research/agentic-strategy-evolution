metadata:
  iteration: 1
  family: "greedy-sa-rect-packing"
  research_question: "What algorithm maximizes the Frontier-CS judge score for algorithmic problem #147?"
  complexity_tier: 1
  tier_justification: "iter 1, single mechanism (SA vs no-SA)"

arms:
  - type: h-main
    prediction: "The greedy+SA approach will score above 80 on the judge, with SA contributing a significant improvement over greedy-only placement by iteratively refining rectangle boundaries toward target areas."
    mechanism: "Simulated annealing explores the solution space by randomly perturbing rectangle boundaries and accepting moves that improve satisfaction (area closer to target). The combination of expand-to-limit moves (maxExp) and target-aware expansion/shrinkage allows the SA to escape local optima where greedy gets stuck due to blocking neighbors."
    diagnostic: "If score is below 80, check: (1) whether greedy phase fills enough space for SA to have a good starting point, (2) whether SA temperature schedule allows enough exploration early on, (3) whether the 9.3s time budget is sufficient for convergence."
    code_changes:
      - file: "solution.cpp"
        intent: "Implement the full greedy+SA rectangle packing algorithm: greedy expansion with small steps (sqrt(ratio)*3, max 150) for ~2s, then SA with 8 move types (boundary shifts, expand-to-limit, target-aware) with linear cooling from T=0.01 for ~7s."
        rationale: "This is the primary algorithm under test. The greedy provides a reasonable starting point; SA refines boundaries to maximize the satisfaction function."

  - type: h-control-negative
    prediction: "The greedy-only approach (no SA) will score significantly lower than h-main, likely below 70, because greedy expansion with fixed step sizes cannot escape suboptimal configurations where neighboring rectangles block each other."
    mechanism: "Without SA, the algorithm can only expand rectangles in fixed-size steps and cannot shrink or shift them. Once a rectangle blocks a neighbor, there is no mechanism to redistribute space. This creates many rects stuck far from their target area."
    diagnostic: "If greedy-only scores close to h-main, then SA is not contributing meaningfully and the bottleneck is in the initial placement or the move set."
    code_changes:
      - file: "solution.cpp"
        intent: "Implement greedy-only rectangle packing: same greedy expansion phase as h-main but remove the SA phase entirely. Output the greedy result directly after the expansion loop completes."
        rationale: "This ablation isolates the SA contribution by removing it entirely."

# Arm selection note: Two arms (treatment vs control) is the simplest tier-1 design.
# h-main tests the full algorithm; h-control-negative tests whether SA is the key driver.

experiment_spec:
  preflight_commands: []
  verified_parameters:
    time_limit_seconds: 10
    grid_size: 10000
    max_n: 200
  unlocked_parameters_audit:
    - name: sa_initial_temperature
      default_value: 0.01
      justification: "Tuned empirically; linear cooling from 0.01 produced 85 score."
    - name: sa_time_budget
      default_value: 9.3
      justification: "Uses most of the 10s limit while leaving margin for I/O."
    - name: greedy_step_multiplier
      default_value: 3
      justification: "sqrt(ratio)*3 with max 150; small enough to avoid overshooting but large enough for fast convergence."
    - name: rng_seed
      default_value: 42
      justification: "Fixed seed for reproducibility; score variance across seeds is expected to be small given 100 test cases."
