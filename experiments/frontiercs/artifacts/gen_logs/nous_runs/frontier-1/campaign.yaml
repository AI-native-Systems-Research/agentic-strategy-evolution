    \ in the finding metadata under key 'score'. Each experiment arm should try a\
    \ distinct algorithmic strategy (different heuristic, exact method, or optimization)\
    \ and report its measured score. The judge call takes ~30-60s; call it once per\
    \ arm.\n\nPROBLEM STATEMENT:\nProblem F: Treasure Packing\n\nA dragon has terrorized\
    \ the region for decades, breathing fire and stealing treasures. A hero has decided\
    \ to steal back the treasures and return them to the community. However, they\
    \ drastically underestimated the size of the dragon's hoard, bringing only a single\
    \ 25 liter bag, only strong enough to hold 20 kg, to carry out the treasures.\
    \ The hero has decided to try to return as much value as possible. The dragon\
    \ has 12 different types of items of different values, masses, and volumes: crowns,\
    \ figurines, jeweled goblets, gold helms, etc., where each item of the same type\
    \ has the same mass and volume. For example, all goblets have the same mass and\
    \ volume. Write a program helping the hero determine what items they should put\
    \ in the bag so as to maximize value accounting for the constraints on the bag.\n\
    \nInput\nThe input is JSON keyed by treasure category name, such as \"goblet\"\
    . Every category has a unique name composed of at most 100 lowercase ASCII characters.\
    \ There are exactly twelve treasure categories. Each corresponding value is a\
    \ list with one integer q (1 <= q <= 10000) and three integers v (0 < v <= 10^9),\
    \ m (0 < m <= 20 * 10^6), and l (0 < l <= 25 * 10^6), where q is the maximum number\
    \ of treasures of this category that can be looted, v is the value of one item,\
    \ m is the mass (in mg) of one item, and l the volume (in \xB5liters) of one item.\
    \ (There are one million mg per kg and \xB5liters per liter.)\n\nPlease see the\
    \ sample input for an example of how the JSON is formatted.\n\nOutput\nPrint a\
    \ JSON with the same keys as the input, but with single a nonnegative integer\
    \ values giving the numbers of items of that category added to the bag in your\
    \ solution.\n\nScoring\nProducing an algorithm that always generates optimal solutions\
    \ is very difficult, so your solution only needs to be \"good enough\". We will\
    \ compare your output to a baseline heuristic provided by the NSA, and to a best\
    \ effort to compute the true optimum. You must beat the NSA heuristic to receive\
    \ points; after that, the better your solution, the higher your score. Specifically,\
    \ your score on this problem is your average of the per-test-case score.\n\n100\
    \ * clamp((your value - baseline value) / (best value - baseline value), 0, 1).\n\
