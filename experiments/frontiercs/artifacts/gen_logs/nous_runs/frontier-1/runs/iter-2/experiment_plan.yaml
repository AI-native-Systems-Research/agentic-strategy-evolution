metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
  mode: real

setup:
  - cmd: "g++ -O2 -pipe -static -s -std=gnu++17 -o solution solution.cpp"

arms:
  - arm_id: "h-main"
    conditions:
      - name: "h-main-run1"
        cmd: "git checkout -- solution.cpp && git apply patches/h-main.patch && g++ -O2 -pipe -static -s -std=gnu++17 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-main/run1.txt"
        output: "results/h-main/run1.txt"
      - name: "h-main-run2"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-main/run2.txt"
        output: "results/h-main/run2.txt"
      - name: "h-main-run3"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-main/run3.txt"
        output: "results/h-main/run3.txt"
      - name: "h-main-run4"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-main/run4.txt"
        output: "results/h-main/run4.txt"
      - name: "h-main-run5"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-main/run5.txt"
        output: "results/h-main/run5.txt"

  - arm_id: "h-ablation"
    conditions:
      - name: "h-ablation-run1"
        cmd: "git checkout -- solution.cpp && git apply patches/h-ablation.patch && g++ -O2 -pipe -static -s -std=gnu++17 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-ablation/run1.txt"
        output: "results/h-ablation/run1.txt"
      - name: "h-ablation-run2"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-ablation/run2.txt"
        output: "results/h-ablation/run2.txt"
      - name: "h-ablation-run3"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee results/h-ablation/run3.txt"
        output: "results/h-ablation/run3.txt"
