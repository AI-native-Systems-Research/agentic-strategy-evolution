metadata:
  iteration: 1
  bundle_ref: "runs/iter-1/bundle.yaml"
setup:
  - cmd: "g++ -O2 -pipe -static -s -std=gnu++17 -o solution solution.cpp"
    description: "Compile the solution with Docker-compatible flags"
arms:
  - arm_id: "h-main"
    conditions:
      - name: "bnb-lagrangian"
        cmd: "git checkout -- . && git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/patches/h-main.patch && g++ -O2 -pipe -static -s -std=gnu++17 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee /home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/results/h-main/score.txt"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/results/h-main/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/patches/h-main.patch"
  - arm_id: "h-control-negative"
    conditions:
      - name: "pure-greedy"
        cmd: "git checkout -- . && git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/patches/h-control-negative.patch && g++ -O2 -pipe -static -s -std=gnu++17 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_1.sh $PWD/solution.cpp | tee /home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/results/h-control-negative/score.txt"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/results/h-control-negative/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-1/runs/iter-1/patches/h-control-negative.patch"
