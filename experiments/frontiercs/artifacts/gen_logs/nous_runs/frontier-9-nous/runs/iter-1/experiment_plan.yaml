metadata:
  iteration: 1
  bundle_ref: "runs/iter-1/bundle.yaml"

setup:
  - cmd: "g++ -O2 -o solution solution.cpp"
    description: "Build the solution"

arms:
  - arm_id: "h-main"
    conditions:
      - name: "tree-dp-alternating-optimized"
        cmd: "git checkout -- . && git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/patches/h-main.patch && g++ -O2 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp > /home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/results/h-main/score.txt 2>&1"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/results/h-main/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/inputs/solution_v2_optimized.cpp"
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/patches/h-main.patch"

  - arm_id: "h-control-negative"
    conditions:
      - name: "naive-greedy-baseline"
        cmd: "git checkout -- . && cp /home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/inputs/solution_naive.cpp solution.cpp && g++ -O2 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp > /home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/results/h-control-negative/score.txt 2>&1"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/results/h-control-negative/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-1/inputs/solution_naive.cpp"
