metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
  mode: real

setup:
  - cmd: "g++ -O2 -o solution solution.cpp"
    description: "Build the system (each arm overwrites solution.cpp then builds)"

arms:
  - arm_id: "h-main"
    conditions:
      - name: "h-main-run1"
        cmd: "git checkout -- solution.cpp && git apply patches/h-main.patch && bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/results/h-main/run1.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/patches/h-main.patch"
      - name: "h-main-run2"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/results/h-main/run2.txt"
        inputs: []
      - name: "h-main-run3"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/results/h-main/run3.txt"
        inputs: []

  - arm_id: "h-ablation"
    conditions:
      - name: "h-ablation-run1"
        cmd: "git checkout -- solution.cpp && git apply patches/h-ablation.patch && bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/results/h-ablation/run1.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/patches/h-ablation.patch"
      - name: "h-ablation-run2"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/results/h-ablation/run2.txt"
        inputs: []
      - name: "h-ablation-run3"
        cmd: "bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-9-nous/runs/iter-2/results/h-ablation/run3.txt"
        inputs: []
