target_system:
  name: frontier-cs::algorithmic::9
  description: "You are solving Frontier-CS algorithmic problem #9. Scoring is CONTINUOUS\
    \ partial credit from 0 to 100 (higher is better); MAXIMIZE it. Your working directory\
    \ is a git worktree containing 'solution.cpp' (a C++17 stub). Edit solution.cpp\
    \ with your algorithm, then compile-check and measure.\n\nMEASURE the objective\
    \ (the judge score) with this ONE command (do not run the judge any other way):\n\
    \    bash /home/ubuntu/frontier/gen_logs/fmeasure_9.sh $PWD/solution.cpp\nIt prints\
    \ a single line 'SCORE: <n>' where n is the judge score (0-100). Record that number\
    \ in the finding metadata under key 'score'. Each experiment arm should try a\
    \ distinct algorithmic strategy (different heuristic, exact method, or optimization)\
    \ and report its measured score. The judge call takes ~30-60s; call it once per\
    \ arm.\n\nPROBLEM STATEMENT:\nTime limit:1 second   Memory limit:1024 megabytes\n\
    \nBobo is given a tree T = (V, E) of n vertices, where there is a number pi on\
    \ vertex i initially, and p1, p2,..., pn is a permutation of 1 to n, meaning that\
    \ all integers from 1 to n appear exactly once in p1, p2, ..., pn.\nIn each operation,\
    \ Bobo can select a matching M (M belongs to E) (M is a matching means that no\
    \ two edges in M share a common vertex), and for each (u,v) belongs to M, swap\
    \ the number on vertex u and vertex v (i.e. swap pu and pv).\nBobo wants to make\
    \ pi = i for each 1<=i<=n with as few operations as possible, can you please help\
    \ him?\n\nInput\nThere are multiple test cases. The first line of the input contains\
    \ an integer T (T>=1), indicating the number of test cases. For each test case:\n\
    - The first line contains a single integer n (10<n<=1000) the number of vertices\
    \ of the tree.\n- The second line contains n integers p1, p2, ..., pn (1<=pi<=n,\
    \ and p is a permutation of 1 to n), meaning the initial number on vertex i is\
    \ pi.\nThen follow n-1 lines, each with integers u, v (1<= u,v <=n, and u not\
    \ equals to v) meaning that there is an edge between u and v.\nIt is guaranteed\
    \ that the sum of n^2 of all test cases will not exceed 10^6.\n\nOutput\nFor each\
    \ test case: The first line contains a single integer m (m>=0) meaning the number\
    \ of operations you used.\nThen m lines follow, where each line starts with an\
    \ integer 0<=ki<n, denoting the number of edges in the matching you select in\
    \ the i-th operation. Then ki integers t_{i,1}, t_{i,2}, ..., t_{i,ki} follow,\
    \ denoting the indexes of edges you select.\n\nScoring\nFor each test case i (1<=i<=T),\
    \ your score s_i = max(0, (base_value-m)/(base_value-best_value))\nyour score\
    \ on each subtask is 0 if any subtask failed to get the correct result, or the\
    \ average of all s_i\n\nExample\nstandard input\n1\n5\n1 4 2 5 3\n1 2\n2 3\n2\
    \ 4\n1 5\nstandard output\n4\n2 4 3\n1 1\n1 2\n1 4"
