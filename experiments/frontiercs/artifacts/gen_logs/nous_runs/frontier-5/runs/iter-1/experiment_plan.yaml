metadata:
  iteration: 1
  bundle_ref: "runs/iter-1/bundle.yaml"
setup:
  - cmd: "g++ -O2 -o sol solution.cpp"
    description: "Build the system (verify compilation)"
arms:
  - arm_id: "h-main"
    conditions:
      - name: "posa-rotation-seed42"
        cmd: |
          git checkout -- solution.cpp &&
          git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/patches/h-main.patch &&
          bash /home/ubuntu/frontier/gen_logs/fmeasure_5.sh $PWD/solution.cpp
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/results/h-main/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/inputs/solution_h_main.cpp"
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/patches/h-main.patch"
  - arm_id: "h-control-negative"
    conditions:
      - name: "greedy-no-rotation-seed42"
        cmd: |
          git checkout -- solution.cpp &&
          git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/patches/h-control-negative.patch &&
          bash /home/ubuntu/frontier/gen_logs/fmeasure_5.sh $PWD/solution.cpp
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/results/h-control-negative/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/inputs/solution_h_control.cpp"
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-1/patches/h-control-negative.patch"
