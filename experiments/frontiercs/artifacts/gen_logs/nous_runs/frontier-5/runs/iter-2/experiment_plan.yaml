metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
  mode: real
setup:
  - cmd: "g++ -O2 -o sol solution.cpp"
    description: "Build the solution"
arms:
  - arm_id: "h-main"
    conditions:
      - name: "scc-aware-rotation-run1"
        cmd: "cp /home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-2/inputs/solution_h_main.cpp solution.cpp && g++ -O2 -o sol solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_5.sh $PWD/solution.cpp"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-2/results/h-main/run1_score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-2/inputs/solution_h_main.cpp"
      - name: "scc-aware-rotation-run2"
        cmd: "cp /home/ubuntu/frontier/gen_logs/nous_runs/frontier-5/runs/iter-2/inputs/solution_h_main.cpp solution.cpp && g++ -O2 -o sol solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_5.sh $PWD/solution.cpp"
