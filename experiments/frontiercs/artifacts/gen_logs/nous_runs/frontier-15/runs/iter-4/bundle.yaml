metadata:
  iteration: 4
  family: "prefix-suffix-sort"
  research_question: "Can extending the BFS-optimal endgame from k=4 to k=5 elements reduce worst-case operation count while maintaining score 100?"
  complexity_tier: 2
  tier_justification: "iter 4, single mechanism (circular buffer rotation) + extended endgame optimization (k=5 via C++ BFS at n=11)"

# Arms chosen:
# - h-main: k=5 endgame extends iter-3's k=4 optimization. BFS at n=11 (with clean
#   small/large operation separation) shows all 119 non-identity permutations of the
#   last 5 elements solvable in ≤5 ops. 4 configs need exactly 5 ops, 73 need 4,
#   33 need 3, 9 need 2. Worst case tightens from 2n-4 to 2n-5.
#
# Skipped arms:
# - h-ablation: iter-2 confirmed Op2 is essential (RP-3). Repeating adds no value.
# - h-control-negative: Score ceiling (100) is algebraic (RP-4). No informative control possible.
# - h-dose-response: The natural dose variable (endgame size k=2..5) produces
#   identical scores (100) for all values. Operation count varies but isn't scored.
# - h-robustness: All 10 test cases have n=1000; no regime variation exists.

arms:
  - type: h-main
    prediction: >
      The k=5 BFS-optimal endgame algorithm will achieve score 100 on all 10 test cases.
      Worst-case operations will be at most 2n-5 = 1995 for n=1000 (reduced from iter-3's
      2n-4 = 1996). Average operations will decrease slightly from iter-3's 1987.3 on
      judge test cases to approximately 1986, because the endgame handles 5 elements in
      at most 5 ops (saving 2 main-loop ops vs k=4 at the cost of at most 1 extra endgame
      op). The score ceiling of 100 remains unbreakable per RP-4.
    mechanism: >
      BFS exploration at n=11 over the 120 permutations of the last 5 elements, using
      only "interesting" operations x,y ∈ {1,2,3,4} ∪ {n-5,n-4,n-3,n-2}, shows ALL 119
      non-identity configurations solvable in at most 5 operations. The key insight:
      n=11 was chosen (not n=10) because at n=10 the small set {1,2,3,4} and the
      n-dependent set {n-5,...,n-2}={5,6,7,8} overlap at value 5, causing 4 sequences
      to fail generalization. At n=11 the gap at value 5 ensures clean separation. Each
      optimal sequence was verified at n=20,50,100,500,1000 before inclusion. The endgame
      cost distribution: 9 configs need 2 ops, 33 need 3, 73 need 4, 4 need 5. Going from
      k=4 to k=5 saves 2 main-loop ops (elements n-5 and n-4 absorbed into endgame) but
      costs at most 1 extra endgame op (max goes from 4 to 5), netting 1 op improvement
      in worst case.
    diagnostic: >
      If score < 100: verify the 119-case dispatch covers all permutations of
      (n-4,n-3,n-2,n-1,n). Check that the main loop terminates at targ=n-5 (not n-4).
      Ensure n-dependent operations like (n-5,y) are valid for test n (need n≥7; all
      test cases have n=1000). If operations > 1995: identify the failing endgame
      configuration — the BFS proves max 5 ops. Cross-check against the verification
      log in gen_robust_log.txt.
    code_changes:
      - file: "solution.cpp"
        intent: >
          Replace the entire solution with the k=5 endgame algorithm. Main loop processes
          elements 2 through n-5 using 2-op circular buffer rotation. Then a 119-case
          dispatch on the configuration of (p[n-5],p[n-4],p[n-3],p[n-2],p[n-1]) applies
          BFS-optimal operation sequences. Small n (≤5) falls back to the iter-1 algorithm.
          The complete implementation is pre-validated at inputs/solution_k5endgame.cpp
          (generated by inputs/gen_k5_robust.cpp, which runs BFS at n=11 and verifies
          generalization at n=20,50,100,500,1000).
        rationale: >
          BFS at n=11 proves ≤5 ops for all k=5 endgame configurations (verified at
          n=20,50,100,500,1000 with 0 errors). 200/200 random n=1000 permutations pass.
          The optimization reduces worst case from 2n-4 to 2n-5 while maintaining score 100.

experiment_spec:
  preflight_commands:
    - "cp inputs/solution_k5endgame.cpp solution.cpp"
    - "g++ -O2 -std=c++17 -o solution solution.cpp"
  verified_parameters:
    n: 1000
    num_test_cases: 10
    time_limit_seconds: 1
    max_operations: 4000
    best_operations_benchmark: 2001
    worst_case_k5_endgame: 1995
  unlocked_parameters_audit:
    - name: "compiler_optimization_level"
      default_value: "-O2"
      justification: "O2 is standard for competitive programming; O3 unlikely to change algorithmic op count"
    - name: "cpp_standard"
      default_value: "c++17"
      justification: "Solution uses only basic STL; any C++11+ standard suffices"
    - name: "endgame_size_k"
      default_value: 5
      justification: "k=5 proven optimal for this iteration via C++ BFS at n=11; k=6 likely intractable (720 permutations, BFS at n=12 requires 12! ≈ 480M states)"
    - name: "bfs_reference_n"
      default_value: 11
      justification: "Minimum n where small ops {1..4} and large ops {n-5..n-2} don't overlap; ensures sequences generalize to all n≥7"
