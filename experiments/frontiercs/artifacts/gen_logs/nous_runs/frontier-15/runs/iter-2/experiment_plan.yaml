metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
  mode: real
setup:
  - cmd: "g++ -O2 -std=c++17 -o solution solution.cpp"
    description: "Build the solution (after applying arm-specific patch)"
arms:
  - arm_id: "h-main"
    conditions:
      - name: "h-main-optimized"
        cmd: "git checkout -- solution.cpp && git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/patches/h-main.patch && g++ -O2 -std=c++17 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_15.sh $PWD/solution.cpp | tee /home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/results/h-main/judge_output.txt"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/results/h-main/judge_output.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/inputs/h-main_solution.cpp"
  - arm_id: "h-ablation"
    conditions:
      - name: "h-ablation-no-op2"
        cmd: "git checkout -- solution.cpp && git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/patches/h-ablation.patch && g++ -O2 -std=c++17 -o solution solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_15.sh $PWD/solution.cpp | tee /home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/results/h-ablation/judge_output.txt"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/results/h-ablation/judge_output.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-15/runs/iter-2/inputs/h-ablation_solution.cpp"
