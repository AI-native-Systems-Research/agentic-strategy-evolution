metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
  mode: real
setup:
  - cmd: "# No build step needed — judge handles compilation internally (g++ -O2 -std=c++17)"
arms:
  - arm_id: "h-main"
    conditions:
      - name: "h-main-run1"
        cmd: "cp /home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-2/inputs/h-main-final-solution.cpp solution.cpp && bash /home/ubuntu/frontier/gen_logs/fmeasure_0.sh $PWD/solution.cpp 2>&1 | tee /home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-2/results/h-main/run1.txt"
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-2/results/h-main/run1.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-2/inputs/h-main-final-solution.cpp"
      - name: "h-main-run2"
