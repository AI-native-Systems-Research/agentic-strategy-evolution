metadata:
  iteration: 1
  bundle_ref: "runs/iter-1/bundle.yaml"
  mode: real

setup:
  - cmd: "# Build handled internally by judge (g++ -O2 -std=c++17)"

arms:
  - arm_id: "h-control-negative"
    conditions:
      - name: "strip-packer"
        cmd: |
          cd /home/ubuntu/frontier/gen_logs/frontier_0_nous_ws/.nous-experiments/iter-1-c53eb582 &&
          git checkout -- . &&
          git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/patches/h-control-negative.patch &&
          bash /home/ubuntu/frontier/gen_logs/fmeasure_0.sh $PWD/solution.cpp 2>&1 | tee /home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/results/h-control-negative/score.txt
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/results/h-control-negative/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/inputs/h-control-negative-solution.cpp"

  - arm_id: "h-main"
    conditions:
      - name: "skyline-packer"
        cmd: |
          cd /home/ubuntu/frontier/gen_logs/frontier_0_nous_ws/.nous-experiments/iter-1-c53eb582 &&
          git checkout -- . &&
          git apply /home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/patches/h-main.patch &&
          bash /home/ubuntu/frontier/gen_logs/fmeasure_0.sh $PWD/solution.cpp 2>&1 | tee /home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/results/h-main/score.txt
        output: "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/results/h-main/score.txt"
        inputs:
          - "/home/ubuntu/frontier/gen_logs/nous_runs/frontier-0/runs/iter-1/inputs/h-main-solution.cpp"
