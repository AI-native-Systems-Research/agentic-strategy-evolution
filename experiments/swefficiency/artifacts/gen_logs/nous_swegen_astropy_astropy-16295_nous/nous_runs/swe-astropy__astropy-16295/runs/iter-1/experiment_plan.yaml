          docker exec swegen_astropy_astropy-16295_nous bash -lc
          "cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed &&
          python -c \"
          import timeit, statistics, json;
          from astropy.coordinates.angles.formats import _check_hour_range;
          runtimes = timeit.repeat(lambda: _check_hour_range(15), number=10, repeat=2000);
          results = {'mean': statistics.mean(runtimes[-1000:]), 'std': statistics.stdev(runtimes[-1000:]), 'condition': 'baseline', 'run': 1};
          print(json.dumps(results))
          \""
