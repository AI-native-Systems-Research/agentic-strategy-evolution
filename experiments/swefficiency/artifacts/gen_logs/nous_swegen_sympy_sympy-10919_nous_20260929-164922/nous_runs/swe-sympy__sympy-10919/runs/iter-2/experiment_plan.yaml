metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
setup:
  - cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python -m pytest -q sympy/ntheory/tests/test_partitions.py'"
    description: "Verify covering tests pass on baseline (iter-1 optimized code)"
arms:
  - arm_id: "baseline"
    conditions:
      - name: "baseline-run1"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "Baseline timing (iter-1 optimized code, no changes)"
      - name: "baseline-run2"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "Baseline timing run 2"
      - name: "baseline-run3"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "Baseline timing run 3"

  - arm_id: "h-main"
    conditions:
      - name: "h-main-apply"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && cp /tmp/partitions_h_main.py sympy/ntheory/partitions_.py'"
        description: "Apply h-main optimized code"
      - name: "h-main-test"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python -m pytest -q sympy/ntheory/tests/test_partitions.py'"
        description: "Verify covering tests pass with h-main"
      - name: "h-main-run1"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "h-main timing run 1"
      - name: "h-main-run2"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "h-main timing run 2"
      - name: "h-main-run3"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "h-main timing run 3"
      - name: "h-main-restore"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && cp /tmp/partitions_baseline.py sympy/ntheory/partitions_.py'"
        description: "Restore baseline"

  - arm_id: "h-ablation"
    conditions:
      - name: "h-ablation-apply"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && cp /tmp/partitions_h_ablation.py sympy/ntheory/partitions_.py'"
        description: "Apply h-ablation code (coprime precomp only, no gmpy2 _d)"
      - name: "h-ablation-test"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python -m pytest -q sympy/ntheory/tests/test_partitions.py'"
        description: "Verify covering tests pass with h-ablation"
      - name: "h-ablation-run1"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "h-ablation timing run 1"
      - name: "h-ablation-run2"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "h-ablation timing run 2"
      - name: "h-ablation-run3"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && source /opt/miniconda3/etc/profile.d/conda.sh && conda activate testbed && python /tmp/workload.py'"
        description: "h-ablation timing run 3"
      - name: "h-ablation-restore"
        cmd: "docker exec swegen_sympy_sympy-10919_nous bash -lc 'cd /testbed && cp /tmp/partitions_baseline.py sympy/ntheory/partitions_.py'"
        description: "Restore baseline"
