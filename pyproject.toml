[project]
name = "nous"
version = "0.5.0"
description = "Nous — hypothesis-driven experimentation framework for software systems"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
    # #183: SDK is the recommended (and only user-facing) execution path
    # post-#120. Make it a required dependency so `pip install nous` lands
    # users on the SDK by default rather than the deprecated claude -p path.
    "claude-agent-sdk==0.2.172",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
nous = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*", "prompts*"]

[tool.setuptools.package-data]
orchestrator = ["v2/schemas/*.json", "defaults.yaml"]
prompts = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
