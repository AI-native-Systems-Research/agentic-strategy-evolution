$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/AI-native-Systems-Research/agentic-strategy-evolution/schemas/campaign.schema.yaml"
title: Campaign Configuration
description: >
  Domain-specific settings for a Nous campaign. Configures the target system,
  reviewer panel, and prompt layers. Generated during setup (with Claude assistance)
  and referenced by state.json via config_ref.

type: object
required: [target_system, research_question, prompts]
additionalProperties: false

$defs:
  comparison:
    type: object
    required: [op, value]
    additionalProperties: false
    description: >
      One comparison vocabulary shared by ``optimization.factors[].manipulation``,
      ``optimization.response.constraints``, and
      ``optimization.design_space.invariants``: ``{observable | metric,
      op, value}``, with optional ``when`` / ``when_not`` level guards
      (supplying both is a validation error). ``value: "{level}"`` is the
      one interpolation token in the whole spec -- it substitutes the
      level under test.
    properties:
      observable: { type: string, minLength: 1, description: "Dotted path into the run observation (e.g. 'telemetry.queue_count')." }
      metric: { type: string, minLength: 1, description: "Alternate name for 'observable' when the comparison is over a response metric." }
      op: { type: string, enum: ["==", "!=", ">", ">=", "<", "<="] }
      value: {}
      when:
        description: "Restrict this check to only these level(s). Mutually exclusive with when_not."
      when_not:
        description: "Restrict this check to every level EXCEPT these. Mutually exclusive with when."

properties:
  kind:
    type: string
    enum: [reflective, optimization]
    default: reflective
    description: >
      Campaign type. ``reflective`` (default) is the existing
      mechanism-discovery flow: an LLM designs each iteration, runs it,
      and interprets the result to build causal claims. ``optimization``
      is a factorial/response-surface flow (see
      ``docs/optimization-campaign-guide.md``): the model proposes
      factors once, Python drives a pre-registered design matrix through
      screen -> refine -> confirm with zero LLM calls in between, and the
      model interprets the fitted surface at the end. Omitting this field
      is identical to ``kind: reflective`` -- every campaign written
      before this field existed is unaffected. ``kind: optimization``
      requires the top-level ``optimization`` block; ``kind: reflective``
      (or absent) forbids one.

  research_question:
    type: string
    minLength: 1
    description: "The guiding research question for this campaign."

  run_id:
    type: string
    minLength: 1
    description: "Working directory name for campaign output. CLI --run-id overrides this. Default: derived from campaign file path."

  max_iterations:
    type: integer
    minimum: 1
    description: "Maximum number of iterations for run_campaign.py. CLI --max-iterations overrides this. Default: 10."

  iterations:
    type: array
    minItems: 1
    description: >
      Optional per-iteration overrides (#212). When present, each entry
      is consulted by index for that iteration's ``mode``. iter-1 looks
      up ``iterations[0]``, iter-2 ``iterations[1]``, and so on. Out-of-
      range iterations fall back to mode=real.

      v1 supports the ``mode`` field: a ``rehearsal`` iteration tells
      the design agent to keep scope minimal — focus on the apparatus
      (does the workload spec parse? do BLIS args bind? does analysis
      validate?) and the feasibility check (does the parameter regime
      actually engage the mechanism?). Surface any campaign-spec
      friction as ``brief_amendments.md`` so subsequent runs of the
      same campaign benefit. A ``real`` iteration is the full run.

      Operators typically schedule iter-1 as rehearsal and iter-2+ as
      real. That's not enforced, just the documented usage.
    items:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [rehearsal, real]
          description: >
            ``rehearsal`` = surgical scope check (#212). ``real`` = full
            arms × full seed list × no scope shrink.

  target_system:
    type: object
    required: [name, description]
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
        description: "Human-readable system name."
      description:
        type: string
        minLength: 1
        description: "What the system does — domain, purpose, architecture."
      observable_metrics:
        type: array
        items: { type: string, minLength: 1 }
        minItems: 1
        description: "Measurable outputs (e.g., latency, throughput, error rate)."
      controllable_knobs:
        type: array
        items: { type: string, minLength: 1 }
        minItems: 1
        description: "What can be changed (algorithms, configs, resource limits)."
      repo_path:
        type: ["string", "null"]
        minLength: 1
        description: "Path to target system git repo. Used by CLIDispatcher for code-access agents. If set, experiments run in isolated worktrees."
      worktree_extras:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
        description: >
          Paths (relative to repo_path) to symlink into each experiment
          worktree on creation (#229). Use this for gitignored assets
          the executor needs from main — virtualenvs, pre-fetched data
          dirs, prior-iteration outputs, build artifacts. Without this
          mechanism, executors discover that the worktree is missing
          their tooling and `cd` back to the parent repo, silently
          breaking isolation. Each entry must be a relative path that
          resolves under repo_path; absolute paths and ``..`` traversal
          are rejected at worktree creation. Source must exist in main
          at the time of worktree creation.
      live_target:
        type: boolean
        description: "If true, the executor runs directly in repo_path with no per-iteration git worktree. Use for campaigns that probe a running system (cluster, service, dataset) where there is no code to evolve. Bundles must contain no code_changes arms."

  metadata:
    type: object
    additionalProperties: true
    description: "User-defined metadata (tags, goal, etc.). Copied to work dir at init."

  models:
    type: object
    additionalProperties: false
    description: "Per-phase model selection. Omit to use --model default for all phases."
    properties:
      design: { type: string, description: "Model for DESIGN phase (claude -p). Default: claude-opus-4-6." }
      execute_analyze: { type: string, description: "Model for EXECUTE_ANALYZE phase (claude -p). Default: claude-sonnet-4-6." }
      report: { type: string, description: "Model for report generation (LLM API). Default: claude-sonnet-4-6." }

  sdk_timeouts:
    type: object
    additionalProperties: false
    description: >
      SDK turn timing controls (#201). Per-campaign tunables for the
      silence detector that surfaces excessive event gaps to
      retry_log.jsonl after each turn. Observation-only today —
      operators can scan retry_log for ``failure_type: sdk_silence`` to
      catch hung subprocesses, polling-loop stalls, and API stalls
      without watching the run live.

      #264 (F19): ``turn_silence_threshold_seconds`` (and the bundle-side
      override at experiment_spec.timing_observations.recommended_turn_silence_threshold_seconds)
      may be either a scalar (legacy: same threshold for every phase) or
      a per-phase map ``{design, execute_analyze, report}``. Different
      phases have different rhythms — DESIGN does heavy reasoning between
      tool calls, EXECUTE_ANALYZE does frequent simulator calls — so
      one number for both is wrong by construction.
    properties:
      silence_threshold_seconds:
        type: number
        minimum: 0
        description: >
          Minimum gap between SDK streaming events that should trigger a
          silence warning in retry_log.jsonl. Default 600 (10 minutes).
          Set to 0 to disable the diagnostic entirely.
      turn_silence_threshold_seconds:
        oneOf:
          - type: number
            minimum: 0
          - type: object
            additionalProperties: false
            properties:
              design: { type: number, minimum: 0 }
              execute_analyze: { type: number, minimum: 0 }
              report: { type: number, minimum: 0 }
        description: >
          Live mid-turn watchdog (#205) override. Scalar form applies
          globally (legacy). Map form (#264 / F19) applies per-phase —
          recommended defaults: design=600, execute_analyze=120,
          report=240. Phases not listed in the map fall back to
          ``silence_threshold_seconds`` (or 600 if also unset).

  sandbox:
    type: string
    enum: [bypass, default]
    description: >
      Claude Agent SDK filesystem sandbox mode (#193). Default: ``bypass``.
      Nous campaigns routinely write outside the launched cwd (the
      orchestrator runs the agent with cwd=experiment-worktree, but
      build/test/BLIS subprocesses write to the main repo's
      .nous/<run>/runs/iter-N/results/). The default sandbox blocks
      these writes; ``bypass`` removes the restriction. Set to
      ``default`` only if the campaign genuinely lives entirely under
      the launched cwd (rare).

  validation:
    type: object
    additionalProperties: false
    description: >
      Per-campaign overrides to nous's validators (#199). Most campaigns
      don't need this block; paper-* and other campaigns with custom
      iter-root artifacts (analysis_summary.json, manifest.json,
      probe_report.md, …) declare them here so validate_design /
      validate_execution don't reject them as "unexpected file at iter
      root."
    properties:
      iter_root_extensions:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
        description: >
          Additional filenames allowed at the iter root (in addition to
          the global whitelist in orchestrator/validate.py). Names only,
          not paths — files in subdirectories are always allowed.
      required_iter_root:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
        description: >
          Filenames that MUST exist at the iter root after EXECUTE_ANALYZE
          completes (#199 v2). validate_execution emits a "required
          iter-root file missing: X" error for each missing entry,
          turning silent omissions into structured failures (sister to
          #187's DesignIncompleteError and #200's
          ExecuteAnalyzeIncompleteError). Required files are implicitly
          allowed at the iter root — no need to also list them in
          iter_root_extensions. Names only, not paths.

  max_turns:
    type: object
    additionalProperties: false
    description: >
      Per-phase maximum tool-use turns (#186). Resolution order:
      campaign.max_turns[phase] > defaults.yaml max_turns[phase] >
      hardcoded fallback (25). Different campaigns have different tool
      budgets — a 50-arm fanout may need 200+ design turns while a
      probe-only campaign fits in 30.
    properties:
      build:
        type: integer
        minimum: 1
        description: >
          Max turns for the ``build`` stage of a ``kind: optimization``
          campaign (authoring the mechanism plus its native tests). Ignored
          by ``kind: reflective``, which has no build stage. Defaults to 120.
      design:
        type: integer
        minimum: 1
        description: "Max turns for the DESIGN phase. Defaults to defaults.yaml.max_turns.design (80)."
      execute_analyze:
        type: integer
        minimum: 1
        description: "Max turns for EXECUTE_ANALYZE. Defaults to defaults.yaml.max_turns.execute_analyze (120)."
      report:
        type: integer
        minimum: 1
        description: "Max turns for the report-generation phase. Defaults to 25 if unset everywhere."

  sdk_options:
    type: object
    additionalProperties: false
    description: >
      Per-phase SDK effort level (#282). Controls how hard the model thinks
      each turn. design defaults to deep reasoning; execute_analyze (coding,
      running simulations, parsing JSON) is often adequate at lower effort.
      Omit the stanza, a phase, or the effort key to use the SDK default
      ("high") — behaviour is then unchanged.
    properties:
      design:
        type: object
        additionalProperties: false
        properties:
          effort:
            type: string
            enum: [low, medium, high, xhigh, max]
            description: "Effort for the DESIGN phase. Omit for SDK default (high)."
      execute_analyze:
        type: object
        additionalProperties: false
        properties:
          effort:
            type: string
            enum: [low, medium, high, xhigh, max]
            description: "Effort for EXECUTE_ANALYZE. Omit for SDK default (high)."

  prompts:
    type: object
    required: [methodology_layer]
    additionalProperties: false
    properties:
      methodology_layer:
        type: string
        minLength: 1
        description: "Path to generic Nous methodology prompts."
      domain_adapter_layer:
        type: ["string", "null"]
        description: >
          ⚠️ NOT YET IMPLEMENTED (issue #89). Setting this field triggers a
          warning and the value is ignored. Put domain-specific context
          (data schema gotchas, exact paths, baselines, statistical
          guardrails) in `target_system.description` instead — that field
          IS substituted into the LLM's prompts. The `nous create-campaign`
          skill walks authors through the correct structure.

  pre_work_script:
    type: string
    minLength: 1
    description: >
      Optional path to a user-supplied pre-work script (issue #167). Run before
      iter-1 DESIGN as a subprocess; the stdout JSON is parsed into a
      pre_work.json artifact that the designer reads as additional context.
      Pure deterministic exploration is the intent — fast, ~$0 LLM cost.
      Path is relative to campaign.yaml.

  objective:
    type: object
    required: [weights]
    additionalProperties: false
    description: >
      Optional composite-scoring objective (issue #168). Declares per-metric
      weights for ranking candidates across iterations. Together with
      best_found.json, drives the deployment recommendation in
      meta_findings.json (issue #170).
    properties:
      weights:
        type: object
        description: "Map of metric name → weight. Weights must be ≥ 0 and sum to 1.0 (with float tolerance)."
        minProperties: 1
        additionalProperties:
          type: number
          minimum: 0
      metric_extractors:
        type: object
        description: >
          Optional map of metric name → dotted path into arms[].metadata
          (e.g. "metadata.compound_return"). When omitted, the metric name
          is used as a flat key in the observed_metrics dict.
        additionalProperties:
          type: string
          minLength: 1
      deploy_threshold:
        type: number
        minimum: 0
        description: "How much best_found composite score must exceed baseline_score to trigger 'deploy' rather than 'deploy_with_caveats'. Default 0.1. Issue #170."

  objective_preset:
    type: string
    enum: [compound-return-style, latency-style]
    description: >
      Opt-in named preset for the objective block (issue #168). Mutually
      exclusive with `objective`. Adding new presets requires a schema
      change so users can never silently inherit weights they didn't see.

  locked_parameters:
    type: object
    additionalProperties: true
    description: >
      Issue #246 (F1): campaign-author-declared parameters that are
      hard-pinned for this campaign's experiments. Each ``key: value``
      entry MUST appear identically in
      ``bundle.experiment_spec.verified_parameters``; mismatches are
      hard validation failures (see ``orchestrator.validate.validate_design``)
      that fire **regardless of --auto-approve**. This is the spec-
      fidelity primitive that closes the gap left by HUMAN_DESIGN_GATE
      bypass under auto-approve.

      Idiomatic keys: ``model``, ``concurrency_per_tenant``,
      ``duration_seconds``, ``warmup_seconds``, ``total_kv_blocks``,
      and any other knob whose deviation would invalidate the
      experiment. See ``docs/campaign-authoring-guide.md`` for the
      "what to lock" inventory.

  locked_workload:
    type: object
    additionalProperties: true
    description: >
      Issue #265 (F20): canonical workload structure that
      ``bundle.inputs/<workload>.yaml`` must match. Same hard-fail
      semantics as ``locked_parameters``, but covers the workload
      yaml content (per-tenant input/output distributions,
      concurrency) which doesn't appear in
      ``verified_parameters``. Entry shape mirrors the workload yaml
      structure so a copy-paste from the canonical workload is the
      simplest authoring path. Deliberate deviations require
      ``bundle.workload_changes_from_canonical`` (see #265).

  derived_from:
    type: object
    additionalProperties: false
    required: [campaign]
    description: >
      Issue #266 (F21): declares that this campaign inherits the
      worktree code state of a prior campaign at a specific iteration.
      At INIT, nous reads
      ``$NOUS_CAMPAIGN_PARENT/<campaign>/runs/iter-<iteration>/patches/cumulative.patch``
      (or the legacy ``<target>/.nous/...`` location) and applies it
      as a preflight to every experiment worktree. Removes the manual
      "find the right patch, verify it applies, bake into preflight_commands"
      archeology that follow-up campaigns paid for in paper-memorytime-mirage.
    properties:
      campaign:
        type: string
        minLength: 1
        description: "run_id of the prior campaign whose code state to inherit."
      iteration:
        oneOf:
          - { type: integer, minimum: 1 }
          - { type: string, enum: [final] }
        description: >
          Iteration whose ``cumulative.patch`` to apply. ``final`` resolves to
          the highest-numbered completed iteration. Default: ``final``.

  plot_specs:
    type: array
    description: >
      Issue #263 (F18): declarative figure pipeline. After
      ``findings.json`` is written in REPORT, nous invokes each
      script with environment variables ``NOUS_RESULTS_DIR`` (the
      iter's results/) and ``NOUS_FIGURES_DIR`` (the iter's
      figures/, auto-created). The script's job is to read JSON
      from results/ and write outputs to figures/. Solves the
      "every paper rebuilds figure scaffolding" problem in one
      campaign-level declaration.
    items:
      type: object
      required: [id, script]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: "Stable identifier (e.g. ``figure-1-mirage-ratio``)."
        script:
          type: string
          minLength: 1
          description: "Path to the figure script (relative to campaign.yaml)."
        consumes:
          type: array
          items: { type: string, minLength: 1 }
          description: "Arm IDs whose results feed this figure (informational; the script reads results/ itself)."
        metrics:
          type: array
          items: { type: string, minLength: 1 }
          description: "Metric names the figure depends on (informational)."
        outputs:
          type: array
          items: { type: string, minLength: 1 }
          description: "Output filenames written to ``figures/`` (informational; checked when the script returns)."
        caption:
          type: string
          description: "Caption text (also used in nous package's README)."

  reproducibility_metadata:
    type: object
    additionalProperties: true
    description: >
      Issue #262 (F17): auto-populated by ``nous run`` at INIT (before
      DESIGN). Captures the environment metadata required for external
      reproduction that nous would otherwise leave to operator
      memory: target repo commit, hardware-config sha, language
      versions, gpu_memory_utilization, etc. Per-iteration snapshots
      of latency-config files land in ``runs/iter-N/snapshots/``.

      The block is user-readable but **not user-set** — values present
      at campaign load time are overwritten by the INIT capturer. To
      pin a value the user controls (e.g. choose a specific commit),
      check it out before running nous; the captured ``repo_commit``
      reflects what was on disk.
    properties:
      repo_commit: { type: string, description: "Target repo HEAD sha at INIT." }
      repo_dirty:
        type: boolean
        description: "True if the working tree had uncommitted changes when nous started."
      hardware_config_sha256:
        type: string
        description: "SHA-256 of the target repo's hardware_config.json (or equivalent)."
      latency_config_files:
        type: array
        items: { type: string, minLength: 1 }
        description: "Paths to model-latency config files snapshotted into snapshots/."
      go_sum_sha256:
        type: string
        description: "SHA-256 of go.sum (Go targets)."
      requirements_sha256:
        type: string
        description: "SHA-256 of requirements.txt / pyproject.toml (Python targets)."
      package_lock_sha256:
        type: string
        description: "SHA-256 of package-lock.json (Node targets)."
      cargo_lock_sha256:
        type: string
        description: "SHA-256 of Cargo.lock (Rust targets)."
      language_versions:
        type: object
        additionalProperties: { type: string }
        description: "Map of language → version string (e.g. ``go: 1.22.0``)."
      gpu_memory_utilization:
        type: number
        description: "vLLM-style fraction; affects K derivation."
      captured_at:
        type: string
        description: "ISO-8601 timestamp when nous wrote this block."

  warm_start:
    type: object
    required: [prior_run_id]
    additionalProperties: false
    description: >
      Optional warm-start from a completed prior campaign on the same
      target repo (issue #83). Copies principles.json + handoff.md
      with drift detection; inherited principles are tagged
      `confidence: inherited` (no drift) or `confidence: tentative`
      (drift detected — designer must revalidate).
    properties:
      prior_run_id:
        type: string
        minLength: 1
        description: "Run id of the prior campaign whose knowledge to inherit."

  theory_references:
    type: array
    description: >
      Optional list of external, established theory the campaign uses
      to ground its ground truths (issue #88). Each entry names a
      theorem / law / identity and (optionally) describes how the
      designer should use it. Pairs with the ground_truth block on
      bundle.yaml (issue #85): theory_references say "here's the
      independent thermometer to use"; ground_truth.independence_argument
      says "and here's why it can disagree with the detector."

      #185: items may be either a string (short name only — useful when
      the theory is well-known and no how-to-use guidance is needed) or
      an object (full metadata). String entries are normalized to
      ``{name: <string>}`` internally.
    items:
      oneOf:
        - type: string
          minLength: 1
          description: >
            Short name only (e.g. "Little's Law"). Normalized internally
            to ``{name: <string>}`` with empty other fields. (#185)
        - type: object
          required: [name, statement]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: "Short name (e.g. 'Little's Law', 'M/G/K stability bound')."
            statement:
              type: string
              minLength: 1
              description: "Plain-English statement of the theorem."
            independent_of_detector:
              type: boolean
              description: "True iff this theorem doesn't depend on the detector under test."
            use_as:
              type: string
              enum: [ground_truth, sanity_check, calibration]
              description: "How the designer should use this in experiments."
            how:
              type: string
              minLength: 1
              description: "Plain-English instructions for applying the theorem (e.g. 'Compute μ_analytical = K / E[S] and compare against measured throughput.')."

  ground_truth:
    type: object
    additionalProperties: false
    description: >
      Optional pre-registered ground truth for the campaign (#185).
      Best-paper rigor calls for declaring the immutable direction
      claim and pass condition before any iteration runs, so the agent
      cannot silently move the goalposts. When present, this block is
      rendered into the agent's prompt template alongside
      ``target_system.description`` so the inner LLM sees it directly.
      Distinct from the per-iteration ``ground_truth`` block on
      bundle.yaml (issue #85) which describes the independence argument
      for that iteration's detector.
    properties:
      pre_registered:
        type: boolean
        description: "True if this ground truth was committed before any data was collected."
      workload:
        type: string
        minLength: 1
        description: "Concrete workload / dataset specification (paths, seeds, params)."
      baselines:
        type: array
        items: { type: string, minLength: 1 }
        description: "Pre-specified baselines the candidate must beat — names that map to bundle.yaml arms."
      primary_metric:
        type: string
        minLength: 1
        description: "The single metric the campaign is evaluated on (e.g. 'P95(latency)')."
      direction_claim:
        type: string
        minLength: 1
        description: "The directional claim being tested (e.g. 'P95(ea-wfq) < P95(wfq) for EARLY class')."
      pass_condition:
        type: string
        minLength: 1
        description: "Concrete pass/fail rule (e.g. 'direction holds in median across 10 seeds AND in ≥7 of 10 seeds')."
      seeds:
        type: array
        items: { type: integer }
        minItems: 1
        description: "Pre-registered seed list. Locking these in advance prevents seed cherry-picking after the fact."

  channels:
    type: array
    description: >
      Issue #130 (Phase A): notification channels POSTed a markdown gate
      summary at each DESIGN/FINDINGS gate, so reviewers can monitor a run
      without sitting at the terminal. Fires even under --auto-approve (the
      notification happens before the gate decision). Consumed by
      ``orchestrator/channels.py``. Best-effort: a webhook timeout, 5xx, or
      DNS failure logs a warning and never blocks the gate or campaign.
    items:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [webhook, slack]
          description: >
            Dispatcher. ``webhook`` POSTs ``{"markdown": ...}`` to ``url``;
            ``slack`` POSTs ``{"text": ...}`` to ``webhook_url``. Defaults to
            ``webhook`` when omitted.
        url:
          type: string
          minLength: 1
          description: "Target URL for a ``webhook`` channel."
        webhook_url:
          type: string
          minLength: 1
          description: "Incoming-webhook URL for a ``slack`` channel."
        headers:
          type: object
          additionalProperties: true
          description: "Optional extra HTTP headers for a ``webhook`` channel."

  optimization:
    type: object
    required: [response, factors, design]
    additionalProperties: false
    description: >
      The ``kind: optimization`` authoring surface: a factorial /
      response-surface campaign spec. The model proposes ``factors``
      once (stage ``verify``); Python then drives ``screen`` -> ``refine``
      -> ``confirm`` with zero further LLM calls, expanding a
      pre-registered design matrix, applying levels mechanically via each
      factor's ``apply``, and checking ``manipulation`` /
      ``design_space.invariants`` / ``response.constraints`` on every
      run. See ``docs/optimization-campaign-guide.md`` for the field-by-
      field walkthrough and worked examples. Cross-field rules this
      schema cannot express (leakage, refinability, resolution feasibility,
      trivial predicates, ...) are enforced by
      ``orchestrator.validate.validate_optimization_campaign``.
    properties:
      response:
        type: object
        required: [primary]
        additionalProperties: false
        description: >
          What the campaign is optimizing, and the guardrails that keep a
          winning candidate honest. Example: ``primary: {metric:
          train_annualized_return, direction: maximize}`` plus a
          ``constraints`` entry so a config that turns a feature off
          entirely (and thereby "wins" trivially) is excluded.
        properties:
          primary:
            type: object
            required: [metric, direction]
            additionalProperties: false
            description: "The single response the design matrix fits. Example: {metric: throughput_gbps, direction: maximize}."
            properties:
              metric:
                type: string
                minLength: 1
                description: "Metric name as it appears in the run observation (e.g. 'throughput_gbps')."
              direction:
                type: string
                enum: [maximize, minimize]
                description: "Whether the fitted surface is climbed or descended."
          constraints:
            type: array
            minItems: 1
            description: >
              Admissibility filters over the SAME observation each config
              produces. A config violating any constraint is marked
              infeasible: excluded from fitting, retained in
              ``runs.jsonl`` as real data about the space. Example:
              ``{metric: trigger_rate_pct, op: ">", value: 0.0}`` rejects
              a config that "wins" by turning the feature off.
            items: { "$ref": "#/$defs/comparison" }
          regimes:
            type: array
            minItems: 1
            description: >
              A conjunction that must hold in EVERY named regime, for
              responses that are constrained trade-offs rather than a
              scalar (issue: a scalar objective lets an optimizer win on
              the average while failing one regime entirely). Example:
              ``{id: crashleg, metric: improvement_crashleg_pct, op: ">",
              value: 0}`` alongside a matching ``uptrend`` entry.
            items:
              type: object
              required: [id, metric, op, value]
              additionalProperties: false
              description: "One regime's pass condition, same comparison shape as constraints plus a stable id for reporting."
              properties:
                id: { type: string, minLength: 1, description: "Stable regime identifier (e.g. 'crashleg')." }
                metric: { type: string, minLength: 1 }
                op: { type: string, enum: ["==", "!=", ">", ">=", "<", "<="] }
                value: {}
                when: {}
                when_not: {}
          held_out:
            type: array
            minItems: 1
            items: { type: string, minLength: 1 }
            description: >
              Metric name(s) reserved as a pure generalization check,
              recorded only at ``confirm`` and NEVER an input to fitting.
              Example: ``[held_out_annualized_return]``. The validator
              hard-fails if any held_out metric also equals
              ``response.primary.metric`` or appears in ``constraints``
              / ``regimes`` -- that is the leakage class that let
              ``symphony-generation`` optimize against its own
              generalization check.
          ceiling:
            type: object
            required: [metric, value]
            additionalProperties: false
            description: >
              Optional physical bound on the primary metric (e.g. a
              hardware bandwidth limit). A response above ceiling
              hard-fails that config -- exceeding it means the
              instrumentation is lying, not that the campaign found a
              miracle. Example: {metric: achieved_bandwidth_gbps, value: 21.1}.
            properties:
              metric: { type: string, minLength: 1 }
              value: { type: number }
          noise_estimate_pct:
            type: number
            minimum: 0
            description: >
              Rough expected measurement noise as a percent of the
              primary metric, used to size replicate counts (via
              ``power.required_seeds``). Example: 3.0 for ~3% run-to-run
              variance.

      factors:
        type: array
        minItems: 1
        description: >
          The knobs the campaign varies. Each becomes one column of the
          design matrix. Example: a ``numeric`` factor ``queue_count``
          with ``levels: [2, 4, 8, 16]``, or a ``choice`` factor
          ``batching`` with ``levels: [off, on]``. See
          ``docs/optimization-campaign-guide.md`` for the full
          "declare as factor vs lock" inventory.
        items:
          type: object
          required: [id, name, type, levels, apply, manipulation, relations]
          additionalProperties: false
          properties:
            id:
              type: string
              minLength: 1
              description: "Short stable identifier used in the design matrix and effect reports (e.g. 'L1')."
            name:
              type: string
              minLength: 1
              description: "Human-readable name (e.g. 'queue_count')."
            type:
              type: string
              enum: [numeric, choice]
              description: >
                A domain question, not a statistics question: are values
                BETWEEN the declared levels runnable? ``numeric`` --
                interpolation is meaningful (thresholds, ratios, counts);
                refinement may report an interior optimum. ``choice`` --
                nothing lives between the levels (policies, mechanisms,
                on/off). The retired ``continuous`` / ``ordinal`` /
                ``categorical`` vocabulary is not accepted.
            levels:
              type: array
              minItems: 2
              description: >
                Every runnable setting for this factor, as a flat list.
                Example: ``[2, 4, 8, 16]`` or ``[off, on]``. Screening
                uses ``screen_levels`` (default: first and last); the
                remaining interior levels are explored only in ``refine``.
              items: {}
            grid:
              type: number
              exclusiveMinimum: 0
              description: >
                For ``numeric`` factors only: snaps a fitted interior
                optimum to the nearest multiple of this step, so
                ``confirm`` never tries to run a value the target can't
                actually take (e.g. K=4.7). Example: ``grid: 1`` for an
                integer-valued knob. Omit when any real value ships
                (thresholds, ratios). Ignored for ``type: choice``.
            screen_levels:
              type: array
              minItems: 2
              maxItems: 2
              description: >
                The two levels the 2-level screening design uses for this
                factor. Must both be members of ``levels``. Default (when
                omitted): ``levels[0]`` and ``levels[-1]``. Declare this
                only when the extremes are known-pathological and the
                screen should bracket a narrower span.
              items: {}
            apply:
              description: >
                The seam that removes the LLM from the inner loop: how a
                level becomes a runnable configuration, with zero model
                involvement. A bare string is CLI-flag shorthand, e.g.
                ``"--queues={level}"``. The long forms are ``{kind:
                cli_flag, template: ...}``, ``{kind: env_var, name: ...,
                value: ...}``, and ``{kind: config_patch, path: ...,
                pointer: ..., value: ...}``. ``{level}`` is the only
                interpolation token in the entire spec.
              oneOf:
                - type: string
                  minLength: 1
                - type: object
                  required: [kind]
                  additionalProperties: true
                  properties:
                    kind:
                      type: string
                      enum: [cli_flag, env_var, config_patch]
            manipulation:
              "$ref": "#/$defs/comparison"
              description: >
                Family A: did the lever actually engage? Checked on every
                run of this factor.

                TWO NAMESPACES are addressable. Prefer the target's own
                telemetry when it reports the relevant state --
                ``{observable: telemetry.queue_count, op: "==", value:
                "{level}"}`` -- because that is evidence the lever was
                RECEIVED, not merely sent. When the target emits metrics
                only and never echoes its configuration back (the common
                case: BLIS/inference-sim and most benchmark harnesses),
                assert against the rendered configuration instead:
                ``{observable: applied.MAXRUN, op: "==", value:
                "{level}"}``, where ``applied.<FACTOR_ID>`` is the level
                this run was launched with. ``applied_args`` and
                ``applied_env`` expose the rendered CLI arguments and
                environment for the same purpose.

                Without ``applied.*`` a target that does not echo its own
                config back cannot satisfy this REQUIRED field at all --
                verified on a live run where all 115 executed
                configurations failed their manipulation check with "the
                target did not emit it", producing zero usable
                measurements.

                The validator rejects trivially-true predicates (bare
                ``> 0``, ``!= null``) -- a lazy check manufactures false
                confidence.
            relations:
              type: array
              minItems: 1
              description: >
                Family B: is the mechanism correct? At least one
                ``correctness`` relation is required -- a ``behavioral``
                relation alone is not enough, because behavioral
                violations are recorded as findings and never fail the
                campaign, so nothing would catch a broken lever. Example:
                a ``correctness`` relation asserting the factor's
                baseline level reproduces the recorded baseline run
                within noise.
              items:
                type: object
                required: [id, kind, statement, native_test]
                additionalProperties: false
                properties:
                  id:
                    type: string
                    minLength: 1
                    description: "Stable identifier (e.g. 'R1')."
                  kind:
                    type: string
                    enum: [correctness, behavioral]
                    description: >
                      ``correctness`` -- a violation hard-fails the
                      campaign (the apparatus is broken; measurements are
                      meaningless). ``behavioral`` -- a violation is
                      recorded as a finding and the campaign continues.
                      Monotonicity claims MUST be ``behavioral``, never
                      ``correctness``: a non-monotonic result can be the
                      campaign's headline discovery, not a bug.
                  statement:
                    type: string
                    minLength: 1
                    description: "Plain-English statement of the relation (e.g. 'batching=off is byte-identical to baseline')."
                  native_test:
                    type: string
                    minLength: 1
                    description: >
                      Identifier of the property/metamorphic test living
                      in the TARGET repo's own test tree, run by its own
                      runner (e.g. 'tests/prop_batch.py::test_off_is_noop').
                      Nous's role is a contract check: this test ran
                      under ``test_command`` and exited clean.

      design:
        type: object
        additionalProperties: false
        description: >
          How the design matrix is sized and staged. Run counts are
          derived from ``screen.resolution`` and the factor count, not
          chosen freely -- see ``orchestrator.optimize.design``.
        properties:
          screen:
            type: object
            required: [resolution]
            additionalProperties: false
            description: >
              The 2-level screening stage. Example: ``{resolution: 5,
              center_points: 4}``. Default resolution is V (estimates all
              two-factor interactions unconfounded); the validator warns
              -- but does not block -- resolution < 5 with more than one
              factor, because main-effects-only screening is the
              one-factor-at-a-time failure mode in disguise.
            properties:
              resolution:
                type: integer
                minimum: 3
                description: "Target design resolution (III, IV, or V). See orchestrator.optimize.design for the tabulated generators."
              center_points:
                type: integer
                minimum: 0
                description: "Replicated center-point runs, giving a pure-error estimate for the lack-of-fit test. Default: 0."
          refine:
            type: object
            required: [kind]
            additionalProperties: false
            description: >
              The response-surface refinement stage, run only when >=2
              ``numeric`` factors with more than 2 levels survive
              screening. Example: ``{kind: central_composite,
              center_points: 5}``.
            properties:
              kind:
                type: string
                enum: [central_composite]
                description: "Response-surface design family."
              center_points:
                type: integer
                minimum: 0
                description: "Replicated center-point runs at the refine stage."
          confirm:
            type: object
            required: [replicates]
            additionalProperties: false
            description: >
              The terminal DISCRIMINATION stage (the paper's ``discriminate``;
              ``confirm`` is this schema's older name for it). It takes a
              shortlist of finalists and measures each of them
              ``replicates`` times FRESHLY, then compares them with each
              other — so the campaign's final comparison does not rest on
              the fitted response surface at all. Example:
              ``{replicates: 5, shortlist_size: 3}``. ``held_out`` metrics
              are evaluated here.
            properties:
              replicates:
                type: integer
                minimum: 1
                description: "Fresh runs per finalist. Total runs at this stage are shortlist_size * replicates."
              shortlist_size:
                type: integer
                minimum: 1
                description: >
                  Finalists compared with fresh replicates at confirm
                  (paper: terminal discrimination). Default 3; ``1``
                  reproduces single-point confirmation, which measures only
                  how REPEATABLE one configuration is and leaves "is it the
                  best?" as a claim about the fitted model.
          max_runs:
            type: integer
            minimum: 1
            description: >
              The author's run budget. The validator fails -- offering
              the two honest options (raise this budget, or accept a
              lower resolution and its named aliasing) -- rather than
              silently downgrading resolution when the requested design
              would exceed it. Example: ``120``.

      design_space:
        type: object
        required: [invariants]
        additionalProperties: false
        description: >
          Properties Python enforces on EVERY configuration, in every
          stage -- including ``screen`` and ``refine``, which make zero
          LLM calls and so cannot honor a directive that exists only as
          prose. Where a violation is statically determinable from the
          matrix row, the row is rejected before it runs; otherwise it
          hard-fails after running. See
          ``docs/optimization-campaign-guide.md``'s "would you be upset
          to find this violated after 60 runs?" test for what belongs
          here versus in ``guidance``.
        properties:
          invariants:
            type: array
            minItems: 1
            description: >
              Example: ``{id: I1, statement: "connector is peer-to-peer,
              never staged through host memory", observable:
              telemetry.transfer_path, op: "==", value: p2p}``.
            items:
              type: object
              required: [id, statement, observable, op, value]
              additionalProperties: false
              properties:
                id: { type: string, minLength: 1, description: "Stable identifier (e.g. 'I1')." }
                statement: { type: string, minLength: 1, description: "Plain-English statement of the invariant." }
                observable: { type: string, minLength: 1, description: "Dotted path into the run observation." }
                op: { type: string, enum: ["==", "!=", ">", ">=", "<", "<="] }
                value: {}

      guidance:
        type: object
        additionalProperties: false
        description: >
          Structured prose for the two model-facing stages -- exactly two
          named slots, because they're consumed at different times and
          blending them wastes tokens in both. Contrast with
          ``design_space.invariants``: guidance shapes what the model
          PROPOSES, invariants bound what Python EXECUTES. An enforceable
          directive belongs in ``invariants``, not here -- prose here is
          not read during ``screen`` / ``refine``.
        properties:
          factor_nomination:
            type: string
            minLength: 1
            description: >
              Read at ``verify``, when the model proposes factors and
              levels. Example: "Scheduling policy is the highest-value
              axis here. Consider at minimum: shortest-job-first, FCFS,
              EA-WFQ, priority-FCFS."
          interpretation:
            type: string
            minLength: 1
            description: >
              Read at ``confirm``, when the model interprets the fitted
              surface. Example: "A win that depends on multi-tier
              workloads is out of scope for this campaign; report it as
              a lead, not a result."

      known_valid_baseline:
        type: object
        minProperties: 1
        additionalProperties: true
        description: >
          Factor id -> level of a configuration KNOWN to be valid: the
          bottom rung of the report's fallback ladder (spec §3.6). A
          finite-budget campaign must still act when it cannot certify,
          and when nothing measured survives the correctness gates this is
          what ``report.json`` returns rather than nothing. It is also the
          shortlist's last-resort finalist. Example: ``{QUEUES: 2,
          BATCHING: off}``. Every id must name a declared factor and every
          level must be one of that factor's ``levels`` — the validator
          hard-fails otherwise, because a baseline outside the declared
          space is not a configuration the campaign is allowed to run.
          Required when the ``build`` stage is declared: the mechanism
          being authored has to leave a known-good control unchanged.

      policy:
        type: object
        additionalProperties: false
        description: >
          The registered decision parameters of the compiled epoch — the
          numbers that decide when the campaign stops, pre-declared so
          they cannot be chosen after seeing a result. Compiled verbatim
          into ``policy.json``'s ``objective`` block and hashed with it.
        properties:
          epsilon:
            type: object
            additionalProperties: false
            description: >
              The indifference width: how much better a challenger would
              have to be for the campaign to care. Declare EXACTLY ONE of
              ``abs`` (in the metric's own units) or ``pct`` (a percentage
              of the recommendation's value). Default ``{pct: 2.0}``.
              Certification is ``R_delta <= epsilon``, so an epsilon of
              zero can never be met and one wider than the whole response
              range certifies immediately.
            properties:
              abs: { type: number, description: "Absolute width, in the primary metric's units." }
              pct: { type: number, exclusiveMinimum: 0, description: "Width as a percent of the recommendation's value." }
          delta_screen:
            type: number
            exclusiveMinimum: 0
            maximum: 0.5
            description: >
              Error budget for the MODEL bound (screen/refine). Default
              0.05. Reported separately from ``delta_terminal`` because
              the two bounds rest on different assumptions;
              ``Pr(wrong global decision) <= delta_screen +
              delta_terminal`` (spec §3.5).
          delta_terminal:
            type: number
            exclusiveMinimum: 0
            maximum: 0.5
            description: >
              Error budget for the TERMINAL bound, computed from fresh
              finalist measurements only. Default 0.05.
          confirm_max_rounds:
            type: integer
            minimum: 1
            description: >
              How many rounds of terminal discrimination the epoch may
              spend before reporting uncertified. Default 1. Each further
              round re-measures the winner plus every finalist whose bound
              still exceeded epsilon.

      run_command:
        type: string
        minLength: 1
        description: >
          Shell command that runs ONE configuration of the target and emits
          the response metrics as JSON on stdout. Each factor's rendered
          ``apply`` arguments are appended to this command, so it carries
          only the invariant part. Example: "./blis run --model qwen/qwen3-14b
          --num-instances 4 --seed 42". Without it, ``run_stage`` has no way
          to execute the design matrix and aborts asking for a
          ``config_runner`` — the campaign is not runnable.

      test_command:
        type: string
        minLength: 1
        description: >
          Shell command that runs every declared relation's
          ``native_test`` and exits clean iff all pass. Example: "pytest
          -q tests/prop_*.py --json-report".

          Must emit PER-TEST results, not just a package-level pass: use
          ``-v`` for ``go test`` or ``--json-report`` for pytest. A green
          exit code with no per-test output is not evidence that a specific
          relation's test ran, so it fails closed — every declared relation
          reconciles as "declared but not executed", which aborts the
          campaign at its verify stage.

      integrity_command:
        type: string
        minLength: 1
        description: >
          Optional shell command that verifies apparatus integrity
          independent of any single relation (e.g. a checksum or
          reconciliation script). Example: "./scripts/verify_integrity.sh".

      stages:
        type: array
        minItems: 1
        description: >
          Optional override of the default iteration -> stage mapping
          (1=verify, 2=screen, 3=refine, 4=confirm). Example: ``[verify,
          screen, confirm]`` to skip refine entirely for a campaign whose
          factors are all ``choice``. An iteration index beyond the list
          resolves to ``confirm`` (never a fresh screen, which would
          re-spend the screening budget).

          ``build`` is opt-in and NOT in the default order. Declare it first
          --- ``[build, verify, screen, confirm]`` --- when the mechanism
          under study does not exist in the target yet and the campaign must
          author it (a new flag, policy, or algorithm) along with the native
          tests its ``relations`` declare. It spends exactly one agent call
          and makes no correctness judgement; ``verify`` remains the gate, so
          the stage that writes the code is never the stage that certifies
          it. Omit ``build`` when every factor maps to a knob the target
          already exposes --- then the campaign stays at ~3 model calls.
        items:
          type: string
          enum: [build, verify, screen, refine, confirm]

      build_checks:
        type: object
        additionalProperties: false
        description: >
          Tuning for the two oracles that check what the ``build`` stage
          actually produced (spec §3.7, oracle 2). Both are on by default
          and both HARD-FAIL at ``verify``; this block exists to move
          their thresholds, not to switch them off casually.
          ``allow_preexisting_tests``, ``baseline_replicates`` and
          ``baseline_tolerance_pct`` are ignored entirely when ``build``
          is not in ``stages``. ``mechanism_paths`` is the ONE
          EXCEPTION: it scopes the drift oracle, which is armed by the
          presence of ``mechanism.sha256`` rather than by the ``build``
          stage, so it applies to every optimization campaign. Entries
          are literal repo-relative paths; globs are rejected by the
          validator (see that field's own description).
        properties:
          allow_preexisting_tests:
            type: boolean
            description: >
              Default false. When false, ``verify`` aborts if any
              declared ``correctness`` relation's ``native_test`` ALREADY
              PASSED before the build ran: a test green against a tree
              without the mechanism is green for some other reason, and
              it stays green if the build wires the mechanism to nothing.
              Set true only when the relation genuinely covers
              pre-existing behaviour — a backward-compatibility test
              asserting an existing default did not change is the
              legitimate case.
          baseline_replicates:
            type: integer
            minimum: 1
            description: >
              How many times the ``known_valid_baseline`` configuration
              is measured before the build and again at ``verify``.
              Default 3 — the smallest count whose mean is not one
              outlier away from either verdict. Raise it on a noisy
              target instead of widening the tolerance.
          baseline_tolerance_pct:
            type: number
            exclusiveMinimum: 0
            description: >
              Allowed relative shift of the control's mean across the
              build, as a percent: the campaign aborts when
              ``|post_mean - pre_mean| / |pre_mean|`` exceeds it.
              Defaults to ``3 x response.noise_estimate_pct`` when that
              is declared, else 5.0. Prefer declaring
              ``noise_estimate_pct`` — it is a fact about the target that
              several other calculations use — and set this only when the
              control's variance genuinely differs from the response's.
          mechanism_paths:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
            description: >
              Which files ARE the mechanism, as repo-relative paths. Scopes
              the drift oracle: every epoch iteration re-hashes the target's
              tree and hard-aborts if it no longer matches
              ``mechanism.sha256``, and this is what that hash covers.
              Example: ``["src/batching.py", "tests/prop_batch.py"]``.
              Matching is a plain path-component prefix, not a glob —
              ``"src/batching.py"`` is that file, ``"src/"`` is everything
              under that directory, and ``"src/batch"`` matches NEITHER
              (a partial component never matches).

              Glob-shaped entries are REJECTED by the validator rather
              than expanded: ``"src/*"``, ``"*.py"``, ``"mech?.py"``,
              ``"src/[ab].py"`` and the whole-tree shorthand ``"."`` all
              hard-fail ``nous validate campaign``. Git's pathspec would
              expand them for the tracked half of the hash while the
              untracked half matched nothing — which is precisely where
              a newly authored mechanism module lives — so an accepted
              glob would leave half the oracle silently disarmed.
              ``nous validate campaign --smoke`` additionally reports an
              entry that resolves to nothing under the target tree
              (skipped when ``build`` is declared, since that stage is
              what authors the file).

              DECLARE THIS. The default, when it is omitted, hashes the
              ENTIRE working tree — every tracked edit plus every untracked
              file git does not ignore. Nous runs the target's own
              ``test_command`` and ``run_command`` with the repo as the
              working directory, so anything they leave behind that is not
              gitignored (a ``.pytest_cache/``, a ``run.log``, a coverage
              file) changes that hash, and the next iteration aborts with
              "mechanism drifted since compile" — a false positive that
              reads exactly like a real one. Naming the mechanism's files
              here removes the whole class of failure.

              The whole-tree default is kept for backward compatibility
              (an existing campaign's recorded hash stays valid), not
              because it is the better setting.

              Unlike the rest of this block, this field is NOT limited to
              campaigns that declare ``build``: the drift oracle is armed by
              the presence of ``mechanism.sha256``, which a campaign may also
              write by hand.
