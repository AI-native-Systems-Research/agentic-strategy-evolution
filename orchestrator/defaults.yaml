# Nous defaults. Only `prices` is read (orchestrator/v2/cost.py).
#
# Per-model token prices (USD per million tokens) for the cost meter.
# Reporting only: cost never drives a Nous decision. Matches the Claude Code
# CLI's own pricing (cache write 1.25x input, cache read 0.1x input; see cost.py).
prices:
  claude-opus-4-6:
    input_tokens: 5.0
    output_tokens: 25.0
  claude-sonnet-4-6:
    input_tokens: 3.0
    output_tokens: 15.0
  claude-haiku-4-5:
    input_tokens: 1.0
    output_tokens: 5.0
