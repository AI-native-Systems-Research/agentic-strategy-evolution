# Example Nous campaign. Set repo_path to your target checkout.
# Every key is listed in the README's "Campaign file" table.
# The agent gets only research_question; name and description are notes for people.
research_question: >
  Does raising the cache size from 64 to 256 entries lower the p99 latency
  of the request benchmark, with requests=10000 and concurrency=8 held fixed?
  Run the benchmark with `python bench.py --cache-size N --seed S`.

run_id: cache-p99
task_type: optimize          # optional hint: debug | verify | optimize | policy | explain | other

target_system:
  name: My service
  description: >
    A service with an in-process LRU cache. `python bench.py --cache-size N --seed S`
    prints p99 latency in ms and writes results/<run>.json.
  repo_path: /path/to/your/repo   # required: the target git checkout

experiment_commands:          # regexes that mark a Bash command as an experiment in runs.jsonl
  - '\bbench\.py\b'
