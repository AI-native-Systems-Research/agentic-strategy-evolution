    /Users/naimaabrar/Desktop/flink/GNN_InferenceStream/data/reddit_edges_features.csv
  If you need it, copy it into your workspace's data/ directory:
    mkdir -p data && cp /Users/naimaabrar/Desktop/flink/GNN_InferenceStream/data/reddit_edges_features.csv data/
  Alternatively, use SyntheticNodeSource.java for synthetic input.

  ## Hard constraints

  DO NOT DELETE ANY FILES outside this workspace. In particular, do not
  delete or modify anything under /Users/naimaabrar/Desktop/flink/
  GNN_InferenceStream/ — that is the source repo and contains data,
  logs, and model files that other experiments depend on. Reading from
